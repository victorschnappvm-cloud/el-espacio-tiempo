<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Quiz | El Espacio Tiempo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <div class="hud-badge">CENTRAL DE MISIÓN</div>
        <h1>EVALUACIÓN CÓSMICA</h1>
        <p>Pon a prueba tus conocimientos sobre el universo</p>
    </header>

    <main class="main-panel">
        <form onsubmit="alert('¡Transmisión completada con éxito! Has finalizado la misión estelar 🌌💙'); window.location.href='index.html'; return false;">
            
            <div class="card-box">
                <p class="quiz-question">1. ¿Qué provoca que el tiempo transcurra más lento en ciertas regiones?</p>
                <label class="quiz-option"><input type="radio" name="p1" required> Gravedad intensa o velocidades lumínicas.</label>
                <label class="quiz-option"><input type="radio" name="p1"> La falta de atmósfera en órbita.</label>
            </div>

            <div class="card-box">
                <p class="quiz-question">2. Si pasas 3 horas cerca de un agujero negro masivo, ¿qué ocurre en la Tierra?</p>
                <label class="quiz-option"><input type="radio" name="p2" required> Transcurren décadas enteras mientras envejeces poco.</label>
                <label class="quiz-option"><input type="radio" name="p2"> Pasan exactamente 3 horas idénticas.</label>
            </div>

            <div class="btn-group">
                <a href="informacion.html" class="sci-btn secondary">⬅️ TEORÍAS</a>
                <button type="submit" class="sci-btn">ENVIAR RESPUESTAS 🚀</button>
            </div>
        </form>
    </main>

</body>
</html>
