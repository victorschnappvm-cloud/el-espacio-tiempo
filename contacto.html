<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Quiz - El Espacio Tiempo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>🚀 Central de Misión</h1>
        <p>Contacto y Cuestionario Estelar</p>
    </header>

    <div class="ventanas-grid">
        <div class="ventana">
            <h3>Envía tu Mensaje</h3>
            <p>¿Tienes dudas sobre el cosmos? Escríbenos directamente desde la base.</p>
            <form onsubmit="event.preventDefault(); alert('¡Mensaje enviado con éxito al espacio exterior! 🌌');" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                <input type="text" placeholder="Tu Nombre" required style="padding: 10px; border-radius: 8px; border: 1px solid #1E88E5; background: #071320; color: #fff;">
                <input type="email" placeholder="Correo electrónico" required style="padding: 10px; border-radius: 8px; border: 1px solid #1E88E5; background: #071320; color: #fff;">
                <button type="submit" class="btn-ventana">Transmitir</button>
            </form>
        </div>

        <div class="ventana">
            <h3>Cuestionario Cósmico</h3>
            <p>¿Qué ocurre cerca del horizonte de sucesos de un agujero negro?</p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                <button class="btn-ventana" onclick="alert('¡Correcto! La gravedad es tan fuerte que atrapa la luz.')">A) La luz queda atrapada</button>
                <button class="btn-ventana" onclick="alert(' Incorrecto. Intenta de nuevo.')">B) El tiempo se acelera infinitamente</button>
            </div>
        </div>
    </div>

    <a href="index.html" class="btn-volver">← Volver al Inicio</a>

</body>
</html>
